name: Pages

# Publishes the results page (site/index.html + docs/backtest-latest.json) to GitHub Pages.
# Runs when the page changes, by hand, and after every Daily backtest run.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    paths:
      - site/**
      - docs/backtest-latest.json
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # After a Daily backtest run, pick up the report the bot just committed.
          ref: ${{ github.ref_name }}

      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp docs/backtest-latest.json _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
